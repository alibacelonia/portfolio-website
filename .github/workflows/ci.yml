name: CI

on:
  pull_request:
  workflow_dispatch:
  # Called by deploy.yml so every deployment is gated on the same checks.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, typecheck, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check
      - run: npm test

      - name: Build static export
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_CONTACT_API_URL: ${{ vars.CONTACT_API_URL }}
          NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.TURNSTILE_SITE_KEY }}
          NEXT_PUBLIC_CAL_LINK: ${{ vars.CAL_LINK }}
          NEXT_PUBLIC_DOCK_STYLE: ${{ vars.DOCK_STYLE }}

      - name: Verify export output
        run: |
          for f in index.html 404.html robots.txt sitemap.xml opengraph-image; do
            test -s "out/$f" || { echo "::error::missing out/$f"; exit 1; }
          done
          if find out -name '*.map' | grep -q .; then echo "::error::source maps in export"; exit 1; fi

      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: out/
          retention-days: 7
          if-no-files-found: error

  e2e:
    name: End-to-end and accessibility tests
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out/

      - run: npx playwright install --with-deps chromium

      - run: npx playwright test

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  terraform:
    name: Terraform fmt and validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: infra/terraform
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~1.16"

      - run: terraform fmt -check -recursive
      - run: terraform init -backend=false -input=false
      - run: terraform validate
